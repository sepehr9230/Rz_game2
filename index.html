<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#12161c">
<title>Creeper Run</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0e12;overflow:hidden;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;justify-content:center;align-items:center}
  #stage{position:relative;width:min(100vw,calc(100vh * 2 / 3));width:min(100vw,calc(100dvh * 2 / 3));
    aspect-ratio:2/3;container-type:inline-size;overflow:hidden;background:#000}
  #c{width:100%;height:100%;display:block}
  #lobby{position:absolute;inset:0;display:flex;flex-direction:column;gap:1.6cqw;padding:2.4cqw 2.6cqw 1.6cqw;
    background:linear-gradient(180deg,rgba(12,16,22,.93),rgba(18,24,30,.96));
    font:700 3.3cqw "Courier New",Consolas,monospace;color:#f2f2f2;text-shadow:.35cqw .35cqw 0 #000}
  #lobby.hide{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:2cqw}
  .title{font-size:6.2cqw;color:#ffe27a;letter-spacing:.05em;line-height:1}
  .title small{display:block;font-size:2.6cqw;color:#8fd0f5;letter-spacing:.12em;margin-top:.8cqw}
  .wallet{display:flex;gap:1.4cqw;align-items:center}
  .chip{display:flex;align-items:center;gap:1.1cqw;background:#23282f;border:.45cqw solid #0a0c0f;
    box-shadow:inset .35cqw .35cqw 0 #3d4550,inset -.35cqw -.35cqw 0 #14171b;padding:1cqw 1.8cqw}
  .chip b{font-size:4cqw;color:#fff}
  .chip small{font-size:2.4cqw;color:#b9c3cf}
  i.coin{display:inline-block;width:4cqw;height:4cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2a1,#f2b705 55%,#c58a00);
    border:.45cqw solid #7a5200;box-shadow:inset 0 0 0 .4cqw #ffd84a}
  i.gem{display:inline-block;width:3.2cqw;height:3.2cqw;margin:0 .4cqw;transform:rotate(45deg);
    background:linear-gradient(135deg,#eaffff,#3de0ee 60%,#1597a8);border:.35cqw solid #0b6f7d}
  button{font:inherit;color:inherit;text-shadow:inherit;cursor:pointer;border:0;padding:0}
  .btn{background:#6b7480;border:.5cqw solid #0a0c0f;padding:1.2cqw 2.2cqw;
    box-shadow:inset .45cqw .45cqw 0 #aab3bf,inset -.45cqw -.45cqw 0 #3e454e}
  .btn:active{transform:translateY(.4cqw)}
  .btn.green{background:#3f9b27;box-shadow:inset .45cqw .45cqw 0 #8be06a,inset -.45cqw -.45cqw 0 #1f5a10}
  .btn.gold{background:#c98f0a;box-shadow:inset .45cqw .45cqw 0 #ffd75e,inset -.45cqw -.45cqw 0 #7a5200}
  .prog{display:flex;align-items:center;gap:2cqw;font-size:2.6cqw;color:#c8d2de}
  .bar{flex:1;height:2.6cqw;background:#0b0d10;border:.4cqw solid #000;position:relative}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffe56b,#e0a800);transition:width .3s}
  .hero{display:flex;gap:2.4cqw;align-items:stretch}
  .previewWrap{width:38cqw;flex:none;display:flex;flex-direction:column;gap:.8cqw;min-width:0}
  #prev{width:100%;aspect-ratio:1;image-rendering:pixelated;border:.6cqw solid #000;flex:none;cursor:grab;touch-action:none;
    box-shadow:0 0 0 .5cqw #3d4550,0 0 1.8cqw #48bde955;background:#172c3b}
  #prev:active{cursor:grabbing}
  .moveTools{display:flex;flex-wrap:wrap;gap:.5cqw;align-items:center;justify-content:center}
  .movePick{font-size:1.9cqw!important;padding:.65cqw .8cqw!important;background:#252e39;border:.3cqw solid #080b10!important;color:#9db0c4!important}
  .movePick.on{background:#176b83!important;color:white!important;border-color:#76e7ff!important}
  .moveTools span{font-size:1.65cqw;color:#9db0c4;text-align:center;width:100%}
  .card{transition:transform .24s cubic-bezier(.2,.8,.2,1),opacity .2s,filter .2s}
  .card.enter{animation:cardIn .32s cubic-bezier(.16,1,.3,1) both}
  .card.sel{animation:selectPop .28s ease-out}
  @keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.94);filter:blur(2px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
  @keyframes selectPop{0%{transform:scale(.94)}70%{transform:scale(1.035)}100%{transform:scale(1)}}
  .tabs button{transition:background .2s,transform .2s,filter .2s}
  .tabs button:active,.btn:active{filter:brightness(1.2);transform:scale(.97)}
  #lobby{animation:lobbyFade .35s ease-out}
  @keyframes lobbyFade{from{opacity:.4;filter:blur(3px)}to{opacity:1;filter:blur(0)}}
  .info{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
  .info .row{font-size:2.9cqw;color:#c8d2de;line-height:1.5}
  .info .row b{color:#fff}
  #play{font-size:6cqw;padding:2.2cqw 0;text-align:center;letter-spacing:.1em}
  .tabs{display:flex;gap:1.2cqw}
  .tabs button{flex:1;background:#2b3138;border:.45cqw solid #0a0c0f;padding:1.6cqw 0;font-size:3.3cqw;color:#aeb8c4;
    box-shadow:inset .35cqw .35cqw 0 #444c57,inset -.35cqw -.35cqw 0 #15181c}
  .tabs button.on{background:#d79a0b;color:#fff;box-shadow:inset .35cqw .35cqw 0 #ffd75e,inset -.35cqw -.35cqw 0 #7a5200}
  .grid{flex:1;min-height:0;overflow-y:auto;display:grid;gap:1.6cqw;align-content:start;padding:.6cqw .6cqw 1cqw 0;
    -webkit-overflow-scrolling:touch}
  .grid.c4{grid-template-columns:repeat(4,1fr)} .grid.c3{grid-template-columns:repeat(3,1fr)} .grid.c2{grid-template-columns:repeat(2,1fr)}
  .grid::-webkit-scrollbar{width:1.2cqw} .grid::-webkit-scrollbar-thumb{background:#59616c}
  .card{background:#262c33;border:.45cqw solid #0a0c0f;padding:1.2cqw;display:flex;flex-direction:column;align-items:center;gap:.8cqw;
    box-shadow:inset .35cqw .35cqw 0 #3d4550,inset -.35cqw -.35cqw 0 #14171b;cursor:pointer;position:relative;min-width:0}
  .card.sel{border-color:#ffd23f;box-shadow:inset 0 0 0 .5cqw #ffd23f}
  .card.lock .face{filter:brightness(.55) saturate(.7)}
  .card canvas{width:100%;image-rendering:pixelated;background:rgba(140,190,240,.16)}
  .card .nm{font-size:2.5cqw;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .card .st{font-size:2.4cqw;color:#9fe27c;display:flex;align-items:center;gap:.6cqw;white-space:nowrap}
  .card .st.price{color:#ffe27a}
  .card .st.need{color:#ff8f8f}
  .card.up{justify-content:center;border-style:dashed;border-color:#59616c}
  .card.up .plus{font-size:11cqw;line-height:1;color:#8fd0f5}
  .card .sub{font-size:2.3cqw;color:#9db0c4;text-align:center}
  .foot{text-align:center;font-size:2.6cqw;color:#7f8b99;letter-spacing:.08em}
  .skyUpload{position:absolute;z-index:3;left:1.2%;top:48%;width:13%;min-height:8%;padding:1cqw .5cqw;background:#176b83;border:.45cqw solid #07151b;box-shadow:inset .4cqw .4cqw 0 #67d9f0,inset -.4cqw -.4cqw 0 #093746;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:6cqw;line-height:1}
  .skyUpload small{font-size:1.9cqw;letter-spacing:0}
  #toast{position:absolute;left:50%;bottom:9cqw;transform:translate(-50%,2cqw);background:rgba(10,12,15,.95);border:.45cqw solid #ffd23f;
    padding:1.6cqw 3cqw;font:700 3cqw "Courier New",monospace;color:#fff;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center;z-index:5}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #modal{position:absolute;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:4}
  #modal.show{display:flex}
  #modal .box{width:80%;background:#2b3138;border:.6cqw solid #000;padding:4cqw;text-align:center;
    box-shadow:inset .5cqw .5cqw 0 #4a525d,inset -.5cqw -.5cqw 0 #15181c;font:700 3.4cqw "Courier New",monospace;color:#fff;text-shadow:.3cqw .3cqw 0 #000}
  #modal h3{margin:0 0 2cqw;font-size:4.4cqw;color:#ffe27a}
  #modal p{margin:0 0 3.4cqw;color:#d5deea;line-height:1.5}
  #modal .acts{display:flex;gap:2cqw} #modal .acts button{flex:1}

  /* ---- settings ---- */
  .gear{font-size:4.6cqw;line-height:1;padding:.9cqw 1.8cqw}
  #settings{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7)}
  #settings.show{display:flex}
  .sbox{width:92%;max-height:94%;display:flex;flex-direction:column;background:#2b3138;border:.6cqw solid #000;
    box-shadow:inset .5cqw .5cqw 0 #4a525d,inset -.5cqw -.5cqw 0 #15181c;font:700 3cqw "Courier New",Consolas,monospace;color:#f2f2f2;text-shadow:.3cqw .3cqw 0 #000}
  .shead{display:flex;justify-content:space-between;align-items:center;padding:2.4cqw 3cqw 1.6cqw;font-size:4.6cqw;color:#ffe27a}
  .shead .btn{font-size:3.4cqw;padding:.8cqw 2cqw}
  .sbody{overflow-y:auto;padding:0 3cqw 3cqw;display:flex;flex-direction:column;gap:1.6cqw;-webkit-overflow-scrolling:touch}
  .ssec{font-size:3.3cqw;color:#8fd0f5;margin-top:1.4cqw;padding-bottom:.8cqw;border-bottom:.35cqw solid #14171b;display:flex;justify-content:space-between;align-items:baseline}
  .ssec small{font-size:2.3cqw;color:#9db0c4}
  .qrow{display:flex;gap:1.2cqw}
  .opt{flex:1;background:#2b3138;border:.45cqw solid #0a0c0f;padding:1.6cqw 0;font-size:2.9cqw;color:#aeb8c4;
    box-shadow:inset .35cqw .35cqw 0 #444c57,inset -.35cqw -.35cqw 0 #15181c}
  .opt.on{background:#d79a0b;color:#fff;box-shadow:inset .35cqw .35cqw 0 #ffd75e,inset -.35cqw -.35cqw 0 #7a5200}
  .opt:active{filter:brightness(1.2)}
  .qdesc{font-size:2.5cqw;color:#b9c3cf;line-height:1.4;min-height:7cqw}
  .vrow{display:flex;align-items:center;gap:2cqw}
  .vrow .btn{font-size:2.8cqw;min-width:17cqw}
  .vrow .btn.on{background:#3f9b27;box-shadow:inset .45cqw .45cqw 0 #8be06a,inset -.45cqw -.45cqw 0 #1f5a10}
  .vrow input[type=range]{flex:1;min-width:0;height:6cqw;accent-color:#ffd23f}
  .vrow span{font-size:2.6cqw;color:#c8d2de;min-width:8cqw;text-align:right}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div id="lobby">
    <div class="top">
      <div class="title">CREEPER RUN<small>RZ EDITION</small></div>
      <div class="wallet">
        <div class="chip"><i class="coin"></i><b id="wCoin">0</b><small>RzCoin</small></div>
        <div class="chip"><i class="gem"></i><b id="wGem">0</b><small>RzGem</small></div>
        <button class="btn gear" id="gear" aria-label="Settings">&#9881;&#xFE0E;</button>
      </div>
    </div>
    <div class="prog">
      <span id="oreTxt">0/50 ores to next RzCoin</span>
      <div class="bar"><i id="oreFill" style="width:0"></i></div>
      <button class="btn gold" id="exch" style="font-size:2.5cqw;padding:1cqw 1.6cqw">20 <i class="coin" style="width:3cqw;height:3cqw"></i> &rarr; 1 <i class="gem" style="width:2.4cqw;height:2.4cqw"></i></button>
    </div>
    <div class="hero">
      <div class="previewWrap"><canvas id="prev" width="240" height="240" aria-label="Skin and pet preview"></canvas></div>
      <div class="info">
        <div>
          <div class="row">SKIN&nbsp; <b id="iSkin"></b></div>
          <div class="row">PET&nbsp;&nbsp; <b id="iPet"></b></div>
          <div class="row">MAP&nbsp;&nbsp; <b id="iMap"></b></div>
          <div class="row">BEST&nbsp; <b id="iBest"></b></div>
        </div>
        <button class="btn green" id="play">PLAY</button>
      </div>
    </div>
    <div class="tabs">
      <button data-tab="skins" class="on">SKINS</button>
      <button data-tab="pets">PETS</button>
      <button data-tab="maps">MAPS</button>
    </div>
    <div class="grid c4" id="grid"></div>
    <div class="foot">made by RzShadow</div>
  </div>

  <div id="settings" role="dialog" aria-label="Settings"><div class="sbox">
    <div class="shead"><span>SETTINGS</span><button class="btn" id="sClose" aria-label="Close settings">&#10005;</button></div>
    <div class="sbody">
      <div class="ssec">GRAPHICS</div>
      <div class="qrow" id="qRow">
        <button class="opt" data-q="low">LOW</button>
        <button class="opt" data-q="medium">MEDIUM</button>
        <button class="opt" data-q="high">HIGH</button>
        <button class="opt" data-q="ultra">ULTRA</button>
      </div>
      <div class="qdesc" id="qDesc"></div>
      <div class="ssec">SOUND EFFECTS</div>
      <div class="vrow"><span style="flex:1;text-align:left">UI, jump, ore & death sounds</span><button class="btn on" id="sfxToggle">ON</button></div>
    </div>
  </div></div>
  <div id="modal"><div class="box"><h3 id="mT"></h3><p id="mB"></p>
    <div class="acts"><button class="btn" id="mNo">Cancel</button><button class="btn green" id="mYes">Buy</button></div></div></div>
  <button id="sideUpload" class="btn skyUpload" aria-label="Upload skin">＋<small>UPLOAD</small></button>
  <div id="toast"></div>
  <input type="file" id="file" accept="image/png,image/*" hidden>
</div>

const cv = $('c'), ctx = cv.getContext('2d');
function fit() {
  const r = cv.getBoundingClientRect();
  const q = Q(), base = r.width * (window.devicePixelRatio || 1) / W;
  const sc = q.res || Math.round(Math.max(q.min, Math.min(q.max, base)) * 2) / 2;
  cv.width = W * sc; cv.height = H * sc;
  ctx.setTransform(sc, 0, 0, sc, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', fit); fit();

const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };

  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillText(s, x + size * .08, y + size * .08);

}

function buildSkin(sk) {
  const img = sk.img, sc = img.width / 64;
  const legacy = img.height <= img.width / 2 + 1;
  const tex = (bx, by, w, h, ox, oy, dark) => {
    const c = document.createElement('canvas'); c.width = w * sc; c.height = h * sc;
    const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
    g.drawImage(img, bx * sc, by * sc, w * sc, h * sc, 0, 0, w * sc, h * sc);
    if (ox != null && !legacy) g.drawImage(img, ox * sc, oy * sc, w * sc, h * sc, 0, 0, w * sc, h * sc);
    if (dark) { g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, c.width, c.height); }
    return c;
  };
  sk.tex = {
    head: tex(0, 8, 8, 8), hat: tex(32, 8, 8, 8),
    body: tex(16, 20, 4, 12, 16, 36),
    rArm: tex(40, 20, 4, 12, 40, 36), rLeg: tex(0, 20, 4, 12, 0, 36),
    lArm: legacy ? tex(40, 20, 4, 12, null, null, true) : tex(32, 52, 4, 12, 48, 52, true),
    lLeg: legacy ? tex(0, 20, 4, 12, null, null, true)  : tex(16, 52, 4, 12, 0, 52, true)
  };
  const f = document.createElement('canvas'); f.width = f.height = 8 * sc;
  const fg = f.getContext('2d'); fg.imageSmoothingEnabled = false;
  fg.drawImage(img, 8 * sc, 8 * sc, 8 * sc, 8 * sc, 0, 0, 8 * sc, 8 * sc);
  fg.drawImage(img, 40 * sc, 8 * sc, 8 * sc, 8 * sc, 0, 0, 8 * sc, 8 * sc);
  sk.face = f;
}

let sfxContext = null;
let sfxReady = false;
let sfxUnlocking = null;
const sfxQueue = [];
function unlockSfx() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return Promise.resolve(null);
    if (!sfxContext) sfxContext = new AC({latencyHint:'interactive'});
    if (sfxContext.state === 'running') { sfxReady = true; return Promise.resolve(sfxContext); }
    if (!sfxUnlocking) {
      sfxUnlocking = sfxContext.resume().then(() => {
        sfxReady = sfxContext.state === 'running';
        if (sfxReady) {
          while (sfxQueue.length) playSfxNow(sfxQueue.shift());
        }
        return sfxReady ? sfxContext : null;
      }).catch(() => null).finally(() => { sfxUnlocking = null; });
    }
    return sfxUnlocking;
  } catch (e) { return Promise.resolve(null); }
}
// Resume synchronously from every user gesture (important on Android browsers).
function sfxGestureUnlock() { if (SAVE.sfx !== false) unlockSfx(); }
document.addEventListener('pointerdown', sfxGestureUnlock, {capture:true, passive:true});
document.addEventListener('touchstart', sfxGestureUnlock, {capture:true, passive:true});
document.addEventListener('keydown', sfxGestureUnlock, {capture:true});
function playSfx(kind) {
  if (SAVE.sfx === false) return;
  if (!sfxContext || sfxContext.state !== 'running') {
    // Preserve the effect that happened during the browser's first audio unlock.
    if (sfxQueue.length < 8) sfxQueue.push(kind);
    unlockSfx();
    return;
  }
  playSfxNow(kind);
}
function playSfxNow(kind) {
  const ac = sfxContext;
  if (!ac || ac.state !== 'running' || SAVE.sfx === false) return;
  const now = ac.currentTime + 0.001;
  const presets = {
    ui:    {notes:[[620,.035],[880,.045]], wave:'sine', vol:.045},
    jump:  {notes:[[240,.045],[410,.065]], wave:'square', vol:.055},
    ore:   {notes:[[880,.035],[1175,.045],[1568,.065]], wave:'sine', vol:.065},
    coin:  {notes:[[660,.045],[990,.05],[1320,.085]], wave:'triangle', vol:.065},
    death: {notes:[[420,.075],[300,.09],[190,.15]], wave:'sawtooth', vol:.055},
    buy:   {notes:[[520,.045],[780,.045],[1040,.085]], wave:'triangle', vol:.05}

  const preset = presets[kind] || presets.ui;
  preset.notes.forEach((note, i) => {
    const osc = ac.createOscillator(), gain = ac.createGain();
    const start = now + i * (kind === 'death' ? .08 : .042);
    osc.type = preset.wave;
    osc.frequency.setValueAtTime(note[0], start);
    if (kind === 'jump') osc.frequency.exponentialRampToValueAtTime(note[0] * 1.45, start + note[1]);
    if (kind === 'death') osc.frequency.exponentialRampToValueAtTime(Math.max(55, note[0] * .65), start + note[1]);
    gain.gain.setValueAtTime(.0001, start);
    gain.gain.exponentialRampToValueAtTime(preset.vol, start + .002);
    gain.gain.exponentialRampToValueAtTime(.0001, start + note[1]);

  });
}

  runOres++; orePts += d.pts; SAVE.ores++;
  pop(o.x, o.y - 14, '+' + d.pts, d.glow, 15);
  burst(o.x, o.y, 10, d.c[1], 2.5, true); flash = Math.max(flash, .08);
  while (SAVE.ores >= ORES_PER_COIN) {

    pop(P.x + 15, P.y - 14, '+1 RzCoin', '#ffd23f', 20);

function update(k) {
  const run = state === 'play';
  if (run) {
    runAge += k;
    speed = Math.min(MAP.max, MAP.base + dist / 2500);
    dist += speed * k;
    P.vy += 0.8 * k; P.y += P.vy * k;
    const was = P.air;
    if (P.y >= G - P.h) {
      P.y = G - P.h; P.vy = 0; P.jumps = 0; P.air = false;
      if (was) { P.sq = 0.8; shake = Math.max(shake, 4); burst(P.x+15, G, 14, '#d8c9a8', 3); rings.push({x:P.x+15, y:G, r:8, life:1, c:'255,255,255'}); }
    } else P.air = true;
    if (P.spin > 0) { P.spin += 0.2 * k; if (P.spin >= Math.PI * 2) P.spin = 0; }
    P.step += speed * k * 0.08;

    nextSpawn -= speed * k; if (nextSpawn <= 0) spawnGroup();
    phTimer -= k; if (phTimer <= 0 && runAge > 240) { spawnWarn(); phTimer = (320 + rnd() * 300) * MAP.ph; }
    warns.forEach(w => w.t -= k);
    warns.filter(w => w.t <= 0).forEach(w => phs.push({x:W + 70, y:w.y - 10, w:58, h:20, base:w.y - 10, ph:rnd() * 6, low:w.low}));
    warns = warns.filter(w => w.t > 0);

    obs.forEach(o => o.x -= speed * k);
    ores.forEach(o => o.x -= speed * k);
    phs.forEach(p => { p.x -= (speed + 3.5) * k; p.y = p.base + Math.sin(tick * .09 + p.ph) * (p.low ? 5 : 14); });
    obs = obs.filter(o => o.x > -100); ores = ores.filter(o => o.x > -40); phs = phs.filter(p => p.x > -100);

    const pb = {x:P.x, y:P.y, w:P.w, h:P.h};
    for (const o of obs) if (hit(pb, o, 6)) { die(o.type, o.x + o.w / 2, o.y + o.h / 2, o.type); break; }
    if (state === 'play') for (const p of phs) if (hit(pb, p, 4)) { die('phantom', p.x + p.w / 2, p.y + p.h / 2, 'phantom'); break; }
    // magnet + pickup: generous so ores are easy to grab
    const px = P.x + 15, py = P.y + 33;
    if (state === 'play') ores = ores.filter(o => {
      const dx = px - o.x, dy = py - o.y, d = Math.hypot(dx, dy);
      if (d < 95) { o.x += dx * .16 * k; o.y += dy * .16 * k; }
      if (d < 40) { collect(o); return false; }
      return true;
    });
    // ambient world particles
    if (MAP.id === 'nether' && rnd() < .5 * Q().parts) parts.push({x:rnd() * W, y:G - rnd() * 30, vx:-1 - rnd(), vy:-1 - rnd() * 1.5, life:70, max:70, c:'#ff8a2a', s:2 + rnd() * 2, g:true});
    if (MAP.id === 'end' && rnd() < .4 * Q().parts) parts.push({x:W + 5, y:rnd() * G, vx:-speed * .5 - rnd(), vy:(rnd() - .5) * .8, life:80, max:80, c:'#b45cff', s:2 + rnd() * 2, g:true});
    if (MAP.id === 'desert' && rnd() < .25 * Q().parts) parts.push({x:W + 5, y:G - 20 - rnd() * 120, vx:-speed * 1.2 - rnd() * 2, vy:(rnd() - .5) * .3, life:60, max:60, c:'rgba(240,210,140,.7)', s:2, g:false});
  }
  if (state === 'lobby') dist += 2.5 * k;

  if (run) {
    // ember trail + dust + speed lines
    for (let i = 0; i < 2; i++) if (rnd() < Q().parts)
      parts.push({x:P.x + 6, y:P.y + 12 + rnd() * 44, vx:-speed * (.5 + rnd() * .6), vy:(rnd() - .5) * 1.4,
        life:22 + rnd() * 10, max:32, c:rnd() < .5 ? '#ff3b3b' : '#ff8a5c', s:2 + rnd() * 3, g:true});
    if (!P.air && rnd() < .6) parts.push({x:P.x + 4, y:P.y + P.h - 2, vx:-speed * .6 - rnd() * 1.5, vy:-rnd() * 1.5, life:20, max:20, c:'#d8c9a8', s:3 + rnd() * 3});
    const rate = Math.max(0, (speed - MAP.base) / 7) * .5 + .12;
    if (rnd() < rate * Q().parts) lines.push({x:W + 20, y:30 + rnd() * (G - 60), len:40 + rnd() * 80, v:speed * (2.2 + rnd() * 1.5)});
    // pet
    if (pet) {
      pet.x += (P.x - 52 - pet.x) * .15 * k;
      if (pet.id === 'bee') pet.y += (P.y + 30 + Math.sin(tick / 12) * 8 - pet.y) * .12 * k;
      else {
        if (pet.jt > 0) { pet.jt -= k; if (pet.jt <= 0 && !pet.air) { pet.vy = -11.5; pet.air = true; } }
        pet.vy += .8 * k; pet.y += pet.vy * k;
        if (pet.y >= G) { pet.y = G; pet.vy = 0; pet.air = false; }
      }
    }
  }
  lines.forEach(l => l.x -= l.v * k); lines = lines.filter(l => l.x + l.len > 0);
  P.sq += (1 - P.sq) * Math.min(1, .2 * k);
  parts.forEach(p => { p.x += p.vx * k; p.y += p.vy * k; p.vy += (p.g ? 0 : .3) * k; p.life -= k; });
  parts = parts.filter(p => p.life > 0);
  rings.forEach(r => { r.r += 3.2 * k; r.life -= .05 * k; }); rings = rings.filter(r => r.life > 0);
  pops.forEach(p => { p.y -= .7 * k; p.life -= k; }); pops = pops.filter(p => p.life > 0);
  clouds.forEach(c => { c.x -= .25 * k; if (c.x < -c.w) c.x = W + 20; });
  shake *= .9; flash *= .9; hudPulse *= .92;
}

function die(type, x, y) {
  if (state !== 'play') return;
  playSfx('death');
  state = 'over'; overAt = performance.now(); cause = CAUSE[type];
  finalScore = score();
  const b = SAVE.best[MAP.id] || 0;
  if (finalScore > b) { SAVE.best[MAP.id] = finalScore; newBest = true; }
  save();
  shake = 14; flash = 1;
  const col = {tnt:'#e03a2f', creeper:'#4caf3a', cactus:'#2f8f3a', lava:'#ff7a00', enderman:'#b45cff', phantom:'#4a5a9a'}[type];

  burst(P.x + 15, P.y + 33, 20, '#222', 5);

}

  } else {

  if (shake > .5) ctx.translate((rnd() - .5) * shake, (rnd() - .5) * shake);
  drawScene(SAVE.map === MAP.id || state !== 'lobby' ? MAP.id : SAVE.map);
  ctx.fillStyle = 'rgba(255,255,255,.42)'; lines.forEach(l => ctx.fillRect(Math.round(l.x), Math.round(l.y), l.len, 2));
  ores.forEach(drawOre);
  obs.forEach(drawObstacle);
  phs.forEach(drawPhantom);
  if (state !== 'lobby') {
    if (pet) drawPet(ctx, pet.id, pet.x + 12, pet.y, tick, pet.air);
    if (state !== 'over') drawPlayer();
  }
  rings.forEach(r => {
    ctx.strokeStyle = `rgba(${r.c},${r.life * .7})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.air ? r.r : r.r * .3, 0, 0, 7); ctx.stroke();
  });
  parts.forEach(p => {
    ctx.globalAlpha = Math.min(1, p.life / (p.max * .6));
    if (p.g && Q().glow) ctx.globalCompositeOperation = 'lighter';
    R(p.x, p.y, p.s, p.s, p.c); ctx.globalCompositeOperation = 'source-over';
  });
  ctx.globalAlpha = 1;
  pops.forEach(p => { ctx.globalAlpha = Math.min(1, p.life / 20); txt(p.text, p.x, p.y, p.size, p.color); });
  ctx.globalAlpha = 1;
  ctx.restore();

  if (Q().glow && state === 'play' && speed > MAP.base + 2) {
    const a = Math.min(.4, (speed - MAP.base - 2) / 4.5 * .4);
    const g = ctx.createRadialGradient(W/2, H/2, 180, W/2, H/2, 420);
    g.addColorStop(0, 'rgba(120,0,20,0)'); g.addColorStop(1, `rgba(120,0,20,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (flash > .05) R(0, 0, W, H, `rgba(255,255,255,${flash * .8})`);

  // phantom warnings
  if (state === 'play') warns.forEach(w => {
    if (Math.floor(w.t / 6) % 2) return;
    R(W - 38, w.y - 14, 30, 28, '#000'); R(W - 36, w.y - 12, 26, 24, '#d62c2c');
    txt('!', W - 23, w.y + 8, 22, '#fff');
  });

  // HUD
  if (state === 'play') {
    txt(String(score()), W / 2, 54, 40, '#fff');
    txt(MAP.name, 12, 28, 13, 'rgba(255,255,255,.85)', 'left');
    txt('BEST ' + (SAVE.best[MAP.id] || 0), 12, 46, 13, 'rgba(255,255,255,.75)', 'left');
    const sc = 1 + hudPulse * .35;
    ctx.save(); ctx.translate(W - 112, 28); ctx.scale(sc, sc); coinIcon(0, 0, 11); ctx.restore();
    txt('RzCoin ' + runCoins, W - 12, 33, 18, '#ffe27a', 'right');
    R(W - 112, 48, 100, 8, '#000'); R(W - 111, 49, 98, 6, '#33291a');
    R(W - 111, 49, 98 * SAVE.ores / ORES_PER_COIN, 6, '#ffcf33');
    txt(`${SAVE.ores}/${ORES_PER_COIN} ores`, W - 12, 72, 12, 'rgba(255,255,255,.8)', 'right');
    if (runAge < 260) {
      ctx.globalAlpha = Math.min(1, (260 - runAge) / 60);
      txt('TAP to jump', W / 2, 200, 22, '#fff'); txt('TAP again in the air to double jump', W / 2, 228, 14, '#e8f6ff');
      ctx.globalAlpha = 1;
    }
  }
  if (state === 'over') {
    R(0, 0, W, H, 'rgba(40,0,0,.5)');
    R(40, 110, 320, 400, '#000'); R(44, 114, 312, 392, '#2b3138');
    R(44, 114, 312, 4, '#4a525d'); R(44, 114, 4, 392, '#4a525d'); R(44, 502, 312, 4, '#15181c'); R(352, 114, 4, 392, '#15181c');
    txt('GAME OVER', W / 2, 168, 38, '#ff6a5c');
    txt(cause || '', W / 2, 196, 13, '#c8d2de');
    txt('Score  ' + finalScore, W / 2, 242, 28, '#fff');
    txt(newBest ? 'NEW BEST!' : 'Best  ' + (SAVE.best[MAP.id] || 0), W / 2, 272, 18, '#ffe27a');
    txt(`Ores mined  ${runOres}`, W / 2, 312, 18, '#d9fffb');
    coinIcon(112, 342, 11); txt(`RzCoin earned  +${runCoins}`, 134, 348, 18, '#ffe27a', 'left');
    txt(`Wallet: ${SAVE.coins} RzCoin  ${SAVE.gems} RzGem`, W / 2, 378, 12, '#9db0c4');
    if (performance.now() - overAt > 500) {
      mcBtn(BTN.retry, 'RETRY', ['#3f9b27', '#8be06a', '#1f5a10']);
      mcBtn(BTN.lobby, 'LOBBY', ['#6b7480', '#aab3bf', '#3e454e']);
    }
  }
  // credit
  ctx.globalAlpha = .8; txt('made by RzShadow', W / 2, H - 9, 12, '#fff'); ctx.globalAlpha = 1;
}

const el = (cls, html) => { const d = document.createElement('div'); d.className = cls; if (html != null) d.innerHTML = html; return d; };
const coinTag = n => `<i class="coin" style="width:2.8cqw;height:2.8cqw"></i>${n}`;
const gemTag = n => `<i class="gem" style="width:2.2cqw;height:2.2cqw"></i>${n}`;

function buy(kind, item) {
  const cur = kind === 'map' ? 'gems' : 'coins', label = kind === 'map' ? 'RzGem' : 'RzCoin';
  if (SAVE[cur] < item.cost) { toast(`Not enough ${label}: you have ${SAVE[cur]}, need ${item.cost}`); return; }
  ask('Unlock ' + item.name + '?', `Spend ${item.cost} ${label}?`, 'Buy', () => {
    SAVE[cur] -= item.cost;
    if (kind === 'skin') { SAVE.skins.push(item.id); SAVE.skin = item.id; }
    if (kind === 'pet')  { SAVE.pets.push(item.id);  SAVE.pet = item.id; }
    if (kind === 'map')  { SAVE.maps.push(item.id);  SAVE.map = item.id; }
    save(); renderLobby(); playSfx('buy'); toast(item.name + ' unlocked!');
  });
}
function renderGrid() {
  grid.innerHTML = '';
  grid.className = 'grid ' + (tab === 'skins' ? 'c4' : tab === 'pets' ? 'c3' : 'c2');
  if (tab === 'skins') {
    const list = SKINS.filter(s => s.id !== 'custom'); const cu = SKINS.find(s => s.id === 'custom');
    if (cu) list.unshift(cu);
    list.sort((a,b) => { const ao = a.cost === 0 || SAVE.skins.includes(a.id), bo = b.cost === 0 || SAVE.skins.includes(b.id); return Number(bo)-Number(ao); });
    list.forEach(sk => {
      const owned = sk.cost === 0 || SAVE.skins.includes(sk.id), sel = SAVE.skin === sk.id;
      const c = el('card' + (sel ? ' sel' : '') + (owned ? '' : ' lock'));
      const cvs = document.createElement('canvas'); cvs.className = 'face';
      if (sk.face) { cvs.width = sk.face.width; cvs.height = sk.face.height; cvs.getContext('2d').drawImage(sk.face, 0, 0); } else { cvs.width = cvs.height = 8; }
      c.appendChild(cvs);
      c.appendChild(el('nm', sk.name));
      c.classList.add('enter');
      c.appendChild(el('st' + (owned ? '' : (SAVE.coins >= sk.cost ? ' price' : ' need')), owned ? (sel ? 'SELECTED' : 'OWNED') : coinTag(sk.cost)));
      c.onclick = () => { if (!sk.tex) return; if (owned) { SAVE.skin = sk.id; save(); renderLobby(); } else buy('skin', sk); };
      grid.appendChild(c);
    });
  } else if (tab === 'pets') {
    PETS.forEach(pt => {
      const owned = pt.cost === 0 || SAVE.pets.includes(pt.id), sel = SAVE.pet === pt.id;
      const c = el('card' + (sel ? ' sel' : '') + (owned ? '' : ' lock'));
      const cvs = document.createElement('canvas'); cvs.width = cvs.height = 48; cvs.className = 'face'; cvs.dataset.pet = pt.id;
      c.appendChild(cvs); c.appendChild(el('nm', pt.name)); c.classList.add('enter');
      c.appendChild(el('st' + (owned ? '' : (SAVE.coins >= pt.cost ? ' price' : ' need')), owned ? (sel ? 'ACTIVE' : 'OWNED') : coinTag(pt.cost)));
      c.onclick = () => { if (owned) { SAVE.pet = pt.id; save(); renderLobby(); } else buy('pet', pt); };
      grid.appendChild(c);
    });
  } else {
    MAPS.forEach(m => {
      const owned = m.cost === 0 || SAVE.maps.includes(m.id), sel = SAVE.map === m.id;
      const c = el('card' + (sel ? ' sel' : '') + (owned ? '' : ' lock'));
      const cvs = document.createElement('canvas'); cvs.width = 120; cvs.height = 60; cvs.className = 'face';
      paintMini(cvs, m.id); c.appendChild(cvs); c.classList.add('enter');
      c.appendChild(el('nm', m.name));
      c.appendChild(el('sub', 'Difficulty ' + '★'.repeat(m.stars) + '☆'.repeat(4 - m.stars)));
      c.appendChild(el('sub', 'Best: ' + (SAVE.best[m.id] || 0)));
      c.appendChild(el('st' + (owned ? '' : (SAVE.gems >= m.cost ? ' price' : ' need')), owned ? (sel ? 'SELECTED' : 'OWNED') : gemTag(m.cost)));
      c.onclick = () => { if (owned) { SAVE.map = m.id; save(); renderLobby(); } else buy('map', m); };
      grid.appendChild(c);
    });
  }
}
function paintMini(c, id) {
  const g = c.getContext('2d'), t = THEMES[id]; g.imageSmoothingEnabled = false;
  const gr = g.createLinearGradient(0, 0, 0, 46); gr.addColorStop(0, t.sky[0]); gr.addColorStop(.6, t.sky[1]); gr.addColorStop(1, t.sky[2]);
  g.fillStyle = gr; g.fillRect(0, 0, 120, 60);
  const sil = {overworld:'#79c257', desert:'#dcb066', nether:'#3d0c0c', end:'#1a1326'}[id];
  for (let x = 0; x < 120; x += 10) g.fillStyle = sil, g.fillRect(x, 46 - 6 - Math.round((hash(x * .13 + id.length) * 18) / 3) * 3, 10, 40);
  g.fillStyle = t.grass; g.fillRect(0, 46, 120, 5); g.fillStyle = t.a; g.fillRect(0, 51, 120, 9);
  if (id === 'end') for (let i = 0; i < 14; i++) { g.fillStyle = '#fff'; g.fillRect(hash(i) * 118, hash(i * 3) * 30, 1.5, 1.5); }
}
function renderLobby() {
  $('wCoin').textContent = SAVE.coins; $('wGem').textContent = SAVE.gems;
  $('oreTxt').textContent = `${SAVE.ores}/${ORES_PER_COIN} ores to next RzCoin`;
  $('oreFill').style.width = (SAVE.ores / ORES_PER_COIN * 100) + '%';

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderLobby(); });
$('lobby').addEventListener('click', e => { if (e.target.closest('button,.card')) playSfx('ui'); });
function beginSkinUpload() {
  if (SAVE.gems < 1) { toast('Uploading a skin costs 1 RzGem'); return; }
  ask('Upload skin', 'Uploading one custom skin costs 1 RzGem. Continue?', 'Choose skin', () => $('file').click());
}
$('sideUpload').onclick = beginSkinUpload;

$('exch').onclick = () => {
  if (SAVE.coins < COINS_PER_GEM) { toast(`Need ${COINS_PER_GEM} RzCoin for 1 RzGem (you have ${SAVE.coins})`); return; }
  ask('Exchange', `Trade ${COINS_PER_GEM} RzCoin for 1 RzGem?`, 'Trade', () => { SAVE.coins -= COINS_PER_GEM; SAVE.gems++; save(); renderLobby(); toast('You got 1 RzGem!'); });

$('file').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const ok = im.width >= 64 && im.width % 64 === 0 && (im.height === im.width || im.height === im.width / 2);
      if (!ok) { toast('Skin must be a 64x64 or 64x32 PNG'); return; }
      addCustom(fr.result, good => {
        if (!good) { toast('Could not read that skin'); return; }
        SAVE.gems -= 1; SAVE.custom = fr.result; SAVE.skin = 'custom';
        if (!SAVE.skins.includes('custom')) SAVE.skins.push('custom');
        save(); tab = 'skins'; renderLobby(); toast('Custom skin uploaded! -1 RzGem');
      });
    };
    im.onerror = () => toast('That file is not a valid image');
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
};

/* lobby preview: front-facing voxel 3D-style avatar + draggable skin/pet */
const pv = $('prev'), pg = pv.getContext('2d');
pg.imageSmoothingEnabled = false;
function cubeFace(g, img, sx, sy, sw, sh, x, y, w, h, side, shade=1) {
  if (img) { g.drawImage(img, sx, sy, sw, sh, x, y, w, h); }
  else { g.fillStyle='#6b7480'; g.fillRect(x,y,w,h); }
  if (shade !== 1) { g.fillStyle=`rgba(0,0,0,${1-shade})`; g.fillRect(x,y,w,h); }
  if (side > 0) { g.fillStyle='rgba(0,0,0,.26)'; g.beginPath(); g.moveTo(x+w,y);g.lineTo(x+w+side,y-side*.42);g.lineTo(x+w+side,y+h-side*.42);g.lineTo(x+w,y+h);g.closePath();g.fill(); }
}
function drawVoxelAvatar(g, tex, x, y, scale, turn, phase) {
  const im=skinById(SAVE.skin).img, s=scale, bob=Math.sin(phase*.07)*2.5;
  const frontW=31*s, depth=6*s, head=40*s, bodyW=22*s, bodyH=26*s, limbW=10*s, legH=22*s;
  g.save();g.translate(x,y+bob);g.rotate(Math.sin(phase*.035)*.025);g.scale(1+Math.sin(phase*.04)*.015,1);
  // soft platform shadow
  g.fillStyle='rgba(0,0,0,.36)';g.beginPath();g.ellipse(0,5*s,26*s,6*s,0,0,Math.PI*2);g.fill();
  const u=(a,b,c,d)=>[a* (im?.width/64||1),b*(im?.width/64||1),c*(im?.width/64||1),d*(im?.width/64||1)];
  const frontShift=Math.sin(turn)*3*s, side=Math.max(2,depth*(.7+Math.abs(Math.sin(turn))*.55));
  // legs with subtle alternating walk
  const legSwing=Math.sin(phase*.12)*3*s;
  cubeFace(g,im,...u(0,20,4,12),-bodyW*.28-legSwing*.25,-legH+2*s,limbW,legH,side,.78);
  cubeFace(g,im,...u(0,20,4,12),bodyW*.18+legSwing*.25,-legH+2*s,limbW,legH,side,.93);
  // body front and right side
  cubeFace(g,im,...u(16,20,8,12),-bodyW/2,-legH-bodyH+2*s,bodyW,bodyH,side,.98);
  // front torso overlay texture region
  if(im) g.drawImage(im,16*(im.width/64),20*(im.width/64),8*(im.width/64),12*(im.width/64),-bodyW/2,-legH-bodyH+2*s,bodyW,bodyH);
  // arms swing lightly
  g.save();g.translate(-bodyW/2-limbW*.35,-legH-bodyH+5*s);g.rotate(Math.sin(phase*.12)*.06);cubeFace(g,im,...u(40,20,4,12),-limbW/2,0,limbW,bodyH*.92,side,.75);g.restore();
  g.save();g.translate(bodyW/2-limbW*.2,-legH-bodyH+5*s);g.rotate(-Math.sin(phase*.12)*.06);cubeFace(g,im,...u(40,20,4,12),0,0,limbW,bodyH*.92,side,.95);g.restore();
  // head, front face and shaded side; head texture includes the skin's front face
  const hx=-head/2+frontShift, hy=-legH-bodyH-head+4*s;
  cubeFace(g,im,...u(8,8,8,8),hx,hy,head,head,side,.98);
  if(im) g.drawImage(im,8*(im.width/64),8*(im.width/64),8*(im.width/64),8*(im.width/64),hx,hy,head,head);
  if(im && im.width>=64 && im.height>=64) { g.globalAlpha=.28;g.drawImage(im,40*(im.width/64),8*(im.width/64),8*(im.width/64),8*(im.width/64),hx,hy,head,head);g.globalAlpha=1; }
  g.fillStyle='rgba(255,110,140,.38)';g.fillRect(hx+head*.14,hy+head*.62,head*.2,head*.1);g.fillRect(hx+head*.66,hy+head*.62,head*.2,head*.1);
  // bright top edges make the model read as a blocky 3D character
  g.strokeStyle='rgba(255,255,255,.23)';g.lineWidth=1.2;g.strokeRect(hx+.5,hy+.5,head-1,head-1);
  g.restore();
}
function drawPet3D(g,id,x,y,t,scale=1) {
  g.save();g.translate(x,y+Math.sin(t*.08)*2);g.scale(scale,scale);
  g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(0,2,18,4,0,0,Math.PI*2);g.fill();
  // pseudo-perspective pet: slight yaw, glossy top edge, soft outline, and idle bob
  g.save();g.transform(1,0,-Math.sin(t*.035)*.12,1,0,0);drawPet(g,id,0,0,t,false);g.restore();
  g.globalAlpha=.24;g.fillStyle='#fff';g.fillRect(-10,-24,9,2);g.globalAlpha=1;
  g.restore();
}
function lobbyFrame() {
  const t = THEMES[SAVE.map], off = (tick * 1.1) % 24;
  const gr = pg.createLinearGradient(0,0,0,240);gr.addColorStop(0,t.sky[0]);gr.addColorStop(.65,t.sky[1]);gr.addColorStop(1,t.sky[2]);
  pg.fillStyle=gr;pg.fillRect(0,0,240,240);
  // animated floating particles and distant block landscape
  for(let i=0;i<9;i++){const x=(i*37-tick*.35%260+260)%260;const y=24+(i*23)%118;pg.fillStyle=`rgba(255,255,255,${.12+(i%3)*.06})`;pg.fillRect(x,y,2+(i%2),2+(i%2));}
  pg.fillStyle='rgba(0,0,0,.10)';for(let x=-30;x<260;x+=26){const h=16+(Math.sin(x*.12+tick*.01)+1)*10;pg.fillRect(x,147-h,22,h);}
  pg.fillStyle=t.a;pg.fillRect(0,199,240,41);pg.fillStyle=t.grass;pg.fillRect(0,199,240,7);pg.fillStyle=t.grassHi;pg.fillRect(0,199,240,2);
  for(let x=-24;x<240;x+=24){pg.fillStyle=t.spA;pg.fillRect(x-off+24,216,10,9);pg.fillStyle=t.spB;pg.fillRect(x-off+30,225,5,5);}
  // floor guide line
  pg.strokeStyle='rgba(255,255,255,.16)';pg.beginPath();pg.moveTo(0,199);pg.lineTo(240,199);pg.stroke();
  const sp=previewPos.skin, pp=previewPos.pet;
  drawVoxelAvatar(pg,curTex(),120+sp.x,181+sp.y,1.12,Math.sin(tick*.025),tick);
  if(SAVE.pet!=='none')drawPet3D(pg,SAVE.pet,168+pp.x,197+pp.y,tick,1.12);
  document.querySelectorAll('canvas[data-pet]').forEach(c=>{
    const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,48,48);
    if(c.dataset.pet==='none'){g.fillStyle='#6b7480';g.font='bold 28px monospace';g.textAlign='center';g.fillText('-',24,32);return;}
    g.save();g.translate(24,38);g.scale(.95,.95);drawPet3D(g,c.dataset.pet,0,0,tick,.85);g.restore();
  });
}
function pickMoveTarget(target){moveTarget=target;document.querySelectorAll('.movePick').forEach(b=>b.classList.toggle('on',b.dataset.move===target));}
document.querySelectorAll('.movePick').forEach(b=>b.addEventListener('click',()=>pickMoveTarget(b.dataset.move)));

$('settings').addEventListener('pointerdown', e => { if (e.target === $('settings')) closeSettings(); });
addEventListener('keydown', e => { if (e.code === 'Escape' && $('settings').classList.contains('show')) closeSettings(); });
document.querySelectorAll('#qRow .opt').forEach(b => b.onclick = () => { SAVE.quality = b.dataset.q; save(); fit(); renderSettings(); });
renderSettings();
/* =========================================================
   boot
   ========================================================= */
function loop(now) {
  const dt = Math.min(50, now - (last || now)); last = now; tick++;
  update(dt / 16.67);
  draw();
  if (state === 'lobby' && SKINS[0].tex) lobbyFrame();
  requestAnimationFrame(loop);
}
reset();
let pending = SKINS.length;
const finish = () => { if (--pending <= 0) { if (SAVE.custom) addCustom(SAVE.custom, () => renderLobby()); renderLobby(); } };
SKINS.slice().forEach(sk => loadSkin(sk, finish));
renderLobby();
MAP = MAPS.find(m => m.id === SAVE.map) || MAPS[0];
requestAnimationFrame(loop);
